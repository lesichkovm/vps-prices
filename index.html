    <div class="container mb-4">
      <div class="alert alert-warning text-center py-2 mb-3" role="alert">
        <small>All the prices have been researched by AI and may be inaccurate or outdated.</small>
      </div>

      <div id="toolbar" class="d-flex flex-wrap align-items-center gap-3 mb-2">
        <div class="d-flex align-items-center">
          <label for="provider-filter" class="me-2 fw-bold">Provider:</label>
          <select id="provider-filter" class="form-select w-auto">
            <option value="all">All Providers</option>
          </select>
        </div>

        <div class="d-flex align-items-center">
          <label for="price-range" class="me-2 fw-bold">Price Range:</label>
          <select id="price-range" class="form-select w-auto">
            <option value="all">All Tiers</option>
            <option value="tier1">$4.99/mo or less</option>
            <option value="tier2">$5.00/mo - $9.99/mo</option>
            <option value="tier3">$10.00/mo - $19.99/mo</option>
            <option value="tier4">$20.00/mo - $39.99/mo</option>
            <option value="tier5">$40.00/mo - $79.99/mo</option>
            <option value="tier6">$80.00/mo - $159.99/mo</option>
            <option value="tier7">$160.00/mo and above</option>
          </select>
        </div>
      </div>

      <table
        id="vps-table"
        data-toggle="table"
        data-url="data.json"
        data-toolbar="#toolbar"
        data-pagination="true"
        data-page-size="25"
        data-page-list="[10, 25, 50, 100, All]"
        data-search="true"
        data-show-columns="true"
        data-sortable="true"
        data-sort-name="price"
        data-sort-order="asc"
        data-response-handler="responseHandler"
        data-custom-search="priceRangeCustomSearch"
        class="table table-striped table-bordered table-hover">
        <thead>
          <tr>
            <th data-field="provider" data-sortable="true">
              Provider
            </th>
            <th data-field="memory" data-sortable="true" data-sorter="numberSorter">
              Memory (GB)
            </th>
            <th data-field="cpu" data-sortable="true" data-sorter="numberSorter">
              CPUs
            </th>
            <th data-field="disk" data-sortable="true" data-sorter="numberSorter">
              Disk (GB)
            </th>
            <th data-field="price" data-sortable="true" data-sorter="numberSorter" data-formatter="priceFormatter">
              Price
            </th>
            <th data-field="updated_at" data-sortable="true">
              Date Checked
            </th>
          </tr>
        </thead>
      </table>

      <footer class="mt-5 pt-4 border-top text-center text-body-secondary small">
        <p class="mb-1">
          Contributions welcome! Check out the <a href="https://github.com/lesichkovm/vps-prices" target="_blank" rel="noopener" class="text-decoration-none">GitHub Repository</a>.
        </p>
        <p class="mb-0">
          Powered by <a href="https://github.com/lesichkovm/bootlegance" target="_blank" rel="noopener" class="text-decoration-none fw-semibold">Bootlegance</a> themes.
        </p>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.js"></script>
    <script>
      var EXCHANGE_RATES = {
        usd: 1.0,
        eur: 1.12,
        gbp: 1.32
      };

      function populateProviderFilter(res) {
        var providers = {};
        res.forEach(function (row) {
          if (row.provider) {
            providers[row.provider] = true;
          }
        });
        var sortedProviders = Object.keys(providers).sort();
        var $select = $('#provider-filter');
        var currentVal = $select.val() || 'all';
        $select.html('<option value="all">All Providers</option>');
        sortedProviders.forEach(function (provider) {
          $select.append($('<option></option>').val(provider).text(provider));
        });
        $select.val(currentVal);
      }

      function responseHandler(res) {
        populateProviderFilter(res);
        return res.map(function (row) {
          var currency = (row.currency || 'usd').toLowerCase();
          var rate = EXCHANGE_RATES[currency] || 1.0;
          var originalPrice = parseFloat(row.price);

          if (!isNaN(originalPrice)) {
            var converted = originalPrice * rate;
            row.price = (Math.round(converted * 100) / 100).toFixed(2);
          }
          return row;
        });
      }

      function priceFormatter(value) {
        if (value === null || value === undefined || value === '') return '';
        var strVal = value.toString().replace(/[^0-9.-]/g, '');
        var num = parseFloat(strVal);
        if (isNaN(num)) return value;
        return '$' + num.toFixed(2);
      }

      function numberSorter(a, b) {
        var strA = (a !== null && a !== undefined) ? a.toString().replace(/[^0-9.-]/g, '') : '';
        var strB = (b !== null && b !== undefined) ? b.toString().replace(/[^0-9.-]/g, '') : '';
        var aa = parseFloat(strA);
        var bb = parseFloat(strB);
        if (isNaN(aa)) aa = 0;
        if (isNaN(bb)) bb = 0;
        if (aa < bb) return -1;
        if (aa > bb) return 1;
        return 0;
      }

      function matchesPriceRange(priceVal, tier) {
        if (priceVal === null || priceVal === undefined) return false;
        var p = parseFloat(priceVal.toString().replace(/[^0-9.-]/g, ''));
        if (isNaN(p)) return false;

        switch (tier) {
          case 'tier1':
            return p <= 4.99;
          case 'tier2':
            return p >= 5.00 && p <= 9.99;
          case 'tier3':
            return p >= 10.00 && p <= 19.99;
          case 'tier4':
            return p >= 20.00 && p <= 39.99;
          case 'tier5':
            return p >= 40.00 && p <= 79.99;
          case 'tier6':
            return p >= 80.00 && p <= 159.99;
          case 'tier7':
            return p >= 160.00;
          default:
            return true;
        }
      }

      function priceRangeCustomSearch(data, text) {
        var selectedTier = $('#price-range').val();
        var selectedProvider = $('#provider-filter').val();
        var searchText = text ? text.toLowerCase().trim() : '';

        return data.filter(function (row) {
          // Check provider match
          if (selectedProvider && selectedProvider !== 'all' && row.provider !== selectedProvider) {
            return false;
          }

          // Check price tier match
          if (!matchesPriceRange(row.price, selectedTier)) {
            return false;
          }

          // Check text search match
          if (searchText) {
            var rowText = [
              row.provider,
              row.memory,
              row.cpu,
              row.disk,
              row.price,
              row.updated_at
            ].join(' ').toLowerCase();

            return rowText.indexOf(searchText) !== -1;
          }

          return true;
        });
      }

      function applyTheme(theme) {
        var themeUrl = '';
        if (theme && theme !== 'default') {
          themeUrl = 'https://cdn.jsdelivr.net/gh/lesichkovm/bootlegance@main/themes/' + theme + '/theme.css';
        }
        $('#bootlegance-theme').attr('href', themeUrl);
      }

      function applyMode(mode) {
        document.documentElement.setAttribute('data-bs-theme', mode);
      }

      $(function () {
        var savedTheme = localStorage.getItem('bootlegance_theme') || 'default';
        var savedMode = localStorage.getItem('bootlegance_mode') || 'light';

        $('#theme-select').val(savedTheme);
        $('#mode-select').val(savedMode);

        applyTheme(savedTheme);
        applyMode(savedMode);

        $('#theme-select').on('change', function () {
          var theme = $(this).val();
          localStorage.setItem('bootlegance_theme', theme);
          applyTheme(theme);
        });

        $('#mode-select').on('change', function () {
          var mode = $(this).val();
          localStorage.setItem('bootlegance_mode', mode);
          applyMode(mode);
        });

        $('#price-range, #provider-filter').on('change', function () {
          $('#vps-table').bootstrapTable('refreshOptions', {});
        });
      });
    </script>
  </body>
